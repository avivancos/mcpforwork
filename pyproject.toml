[project]
name = "mcpforwork"
dynamic = ["version"]
description = "Open-source, MCP-first job-search copilot. The LLM is the client; we never operate tokens."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Agustin Vivancos", email = "agusvc@gmail.com" }]
dependencies = [
    "mcp>=1.2",
    "pyyaml>=6",
    # HMAC-signed, timestamped session tokens — do NOT hand-roll signed-cookie
    # crypto for an auth boundary (S6.1a magic-link session core).
    "itsdangerous>=2",
    # The parity API (entrypoints/api). Both are already transitive via `mcp`,
    # but the mcpforwork-api entrypoint depends on them directly, so declare them
    # (honest + pin-stable if mcp ever relaxes its transitive floors). ADR 0004.
    "starlette>=0.27",
    "uvicorn>=0.31",
]

[project.optional-dependencies]
# Hosted-only. SQLite self-host installs stay driver-free; the db adapter
# lazy-imports psycopg and raises a clear error if the extra is missing.
postgres = ["psycopg[binary]>=3.1"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpserver>=1.1",
    "ruff>=0.8",
    "import-linter>=2",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",  # Starlette TestClient transport for the API tests
]

[project.scripts]
mcpforwork = "mcpforwork.entrypoints.cli.main:main"
mcpforwork-mcp = "mcpforwork.entrypoints.mcp.server:main"
mcpforwork-api = "mcpforwork.entrypoints.api.app:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mcpforwork/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpforwork"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: requires real external services (local Postgres via Docker, network)",
]

[tool.importlinter]
root_packages = ["mcpforwork"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is pure: imports no other layer"
type = "forbidden"
source_modules = ["mcpforwork.domain"]
forbidden_modules = [
    "mcpforwork.services",
    "mcpforwork.ports",
    "mcpforwork.adapters",
    "mcpforwork.entrypoints",
    "mcpforwork.packs",
]

[[tool.importlinter.contracts]]
name = "services never import driven or driving sides"
type = "forbidden"
source_modules = ["mcpforwork.services"]
forbidden_modules = ["mcpforwork.adapters", "mcpforwork.entrypoints"]

[[tool.importlinter.contracts]]
name = "ports are pure seams"
type = "forbidden"
source_modules = ["mcpforwork.ports"]
forbidden_modules = [
    "mcpforwork.services",
    "mcpforwork.adapters",
    "mcpforwork.entrypoints",
]

[[tool.importlinter.contracts]]
# cli -> mcp.server is the ONE sanctioned edge (serve is a launcher); the MCP
# server must never grow a dependency on the CLI or the API (carried ADR item,
# now three entrypoints exist).
name = "the MCP server never imports the CLI or API entrypoints"
type = "forbidden"
source_modules = ["mcpforwork.entrypoints.mcp"]
forbidden_modules = ["mcpforwork.entrypoints.cli", "mcpforwork.entrypoints.api"]

[[tool.importlinter.contracts]]
# The API is a standalone driving adapter; it wires services/adapters/config but
# never another entrypoint (entrypoint-independence — the deferred rule-of-two
# contract, triggered now that the API is the third entrypoint).
name = "the API entrypoint never imports the MCP or CLI entrypoints"
type = "forbidden"
source_modules = ["mcpforwork.entrypoints.api"]
forbidden_modules = ["mcpforwork.entrypoints.mcp", "mcpforwork.entrypoints.cli"]

[[tool.importlinter.contracts]]
name = "the CLI never imports the API entrypoint"
type = "forbidden"
source_modules = ["mcpforwork.entrypoints.cli"]
forbidden_modules = ["mcpforwork.entrypoints.api"]

[[tool.importlinter.contracts]]
name = "the MCP guidance module is a dependency-free client-facing contract"
type = "forbidden"
source_modules = ["mcpforwork.entrypoints.mcp.guidance"]
forbidden_modules = [
    "mcpforwork.domain",
    "mcpforwork.services",
    "mcpforwork.ports",
    "mcpforwork.adapters",
    "mcpforwork.packs",
    "mcpforwork.config",
]

[[tool.importlinter.contracts]]
name = "no LLM SDKs anywhere in the server (zero server-side LLM invariant)"
type = "forbidden"
source_modules = ["mcpforwork"]
forbidden_modules = [
    "openai",
    "anthropic",
    "litellm",
    "cohere",
    "mistralai",
    "groq",
    # externals are squashed to their root: "google" covers google.genai and
    # google.generativeai (we never import google.* directly for anything else)
    "google",
    "langchain",
    "llama_index",
]
