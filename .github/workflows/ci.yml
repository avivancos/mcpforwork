name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - uses: astral-sh/setup-uv@e0671e8813255a57a0f842cbe1d9d52bbfb9a66c # v5.4

      - name: Install environment
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Architecture boundary contracts
        run: uv run lint-imports

      - name: Consent-verb gate
        # The consent invariant (AGENTS.md §1.2): submit authorization may only
        # be constructed inside services/. Any other occurrence fails the build.
        # The exclusion is anchored to the path field at line start, so it
        # excludes exactly src/mcpforwork/services/ — not nested */services/
        # dirs, and not lines that merely mention the path in a comment.
        run: |
          if grep -RIn --include='*.py' 'submit_authorized' src/mcpforwork/ | grep -v '^src/mcpforwork/services/'; then
            echo "consent gate violated: 'submit_authorized' found outside src/mcpforwork/services/"
            exit 1
          fi

      - name: No substring error matching in the API entrypoint
        # S6.10: services return structured error kinds; the API maps kinds to
        # status codes. Substring sniffing on error messages fails the build.
        run: |
          if grep -RIn --include='*.py' '"not found" in' src/mcpforwork/entrypoints/api/; then
            echo "substring error matching found — map structured error kinds instead"
            exit 1
          fi

      - name: Tests
        run: uv run pytest

  web:
    # Isolated toolchain for web/ (ADR 0002) — the Python job is untouched.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        # --ignore-scripts: don't run dependency lifecycle scripts on CI
        # (supply-chain hardening). The build needs none of them.
        run: npm ci --ignore-scripts

      - name: No LLM SDKs in the dependency tree
        # Structural invariant (zero server-side LLM) mirrored for JS —
        # the import-linter of the web layer.
        run: npm run check:no-llm-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # W5.2: safeRedirect / isSafeBillingUrl open-redirect guard (node:test).
        run: npm run test

      - name: Build
        run: npm run build
